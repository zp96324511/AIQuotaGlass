<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AIQuotaGlass</title>
  <desc id="desc">A glass quota gauge with three usage bars, an AI sparkle, and a realtime refresh point.</desc>
  <defs>
    <linearGradient id="bg" x1="44" y1="34" x2="460" y2="478" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#162d38"/>
      <stop offset="0.48" stop-color="#101a2a"/>
      <stop offset="1" stop-color="#171529"/>
    </linearGradient>
    <linearGradient id="ring" x1="142" y1="118" x2="386" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6fff3"/>
      <stop offset="0.32" stop-color="#4cd6a4"/>
      <stop offset="0.72" stop-color="#5aa7ff"/>
      <stop offset="1" stop-color="#9b84ff"/>
    </linearGradient>
    <linearGradient id="bar-teal" x1="190" y1="232" x2="218" y2="316" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9dffe0"/>
      <stop offset="1" stop-color="#36c995"/>
    </linearGradient>
    <linearGradient id="bar-blue" x1="237" y1="196" x2="265" y2="316" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b7d8ff"/>
      <stop offset="1" stop-color="#4f91ed"/>
    </linearGradient>
    <linearGradient id="bar-amber" x1="284" y1="248" x2="312" y2="316" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe0a1"/>
      <stop offset="1" stop-color="#ed9941"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(240 238) rotate(90) scale(174)">
      <stop stop-color="#4cd6a4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4cd6a4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="62" y1="72" x2="238" y2="316" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#070a11"/>
  <rect x="20" y="20" width="472" height="472" rx="132" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
  <rect x="36" y="36" width="440" height="440" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <path d="M42 246C67 132 158 49 285 36C190 91 137 169 111 266C88 352 65 418 43 453Z" fill="url(#sheen)"/>
  <circle cx="240" cy="238" r="174" fill="url(#halo)"/>

  <path d="M356 156A142 142 0 1 0 356 356" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="28" stroke-linecap="round"/>
  <path d="M356 156A142 142 0 1 0 356 356" fill="none" stroke="url(#ring)" stroke-width="28" stroke-linecap="round"/>
  <path d="M356 356L405 405" fill="none" stroke="url(#ring)" stroke-width="28" stroke-linecap="round"/>
  <circle cx="405" cy="405" r="15" fill="#d6fff3"/>

  <rect x="190" y="240" width="28" height="72" rx="14" fill="url(#bar-teal)"/>
  <rect x="237" y="196" width="28" height="116" rx="14" fill="url(#bar-blue)"/>
  <rect x="284" y="254" width="28" height="58" rx="14" fill="url(#bar-amber)"/>

  <path d="M136 122L143 140L161 147L143 154L136 172L129 154L111 147L129 140Z" fill="#ffffff"/>
  <circle cx="374" cy="119" r="7" fill="#9dffe0"/>
</svg>
